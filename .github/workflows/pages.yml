name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/ui-ux-pro-max-skill-w13rup # default branch
      - claude/mohsin-portfolio-animated-u82kdm # portfolio branch (pre-merge preview)
  workflow_dispatch:

# The default GITHUB_TOKEN may not create a Pages site via the API
# (actions/configure-pages enablement fails with "Resource not accessible
# by integration"), so we publish to a gh-pages branch instead — GitHub
# enables Pages automatically when that branch appears.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site to gh-pages branch
        run: |
          mkdir -p /tmp/site
          cp index.html styles.css script.js /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
